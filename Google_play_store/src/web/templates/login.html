{% extends "layout.html" %}
{% block login_content %}
<div class="card shadow-lg p-4 border-0" style="border-radius: 20px;">
    <div class="text-center mb-4">
        <h4 class="fw-bold text-primary">🧩 Play Console</h4>
        <p class="text-muted small">Будь ласка, увійдіть, щоб продовжити</p>
    </div>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label small fw-bold">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold">Пароль</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Увійти</button>
    </form>
    <div class="text-center mt-3">
        <a href="/user/create?role=customer" class="small text-decoration-none">Ще не маєте акаунту? Реєстрація</a>
    </div>
</div>
{% endblock %}
